name: Verify eBook code
on:
  push:
    branches: [feat/ebook-sales, main]
  pull_request:
    branches: [main]
jobs:
  security-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run check
      - run: npm test
