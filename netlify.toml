[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/index.html"]

[[redirects]]
  from = "/admin.html"
  to = "/admin"
  status = 301
  force = true

[[redirects]]
  from = "/reader-dashboard"
  to = "/"
  status = 301

[[redirects]]
  from = "/"
  to = "/.netlify/functions/api?action=store-page&page=home"
  status = 200

[[redirects]]
  from = "/books"
  to = "/.netlify/functions/api?action=store-page&page=books"
  status = 200

[[redirects]]
  from = "/categories"
  to = "/.netlify/functions/api?action=store-page&page=categories"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api?action=sitemap"
  status = 200

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/book/*"
  to = "/.netlify/functions/api?action=book-page&slug=:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/reader.html"
  [headers.values]
    Cache-Control = "no-store"

[[redirects]]
  from = "/*"
  to = "/app-shell.html"
  status = 200

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

