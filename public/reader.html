<!doctype html>
<html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><title>AKILI STORE</title><link rel="stylesheet" href="/style.css"></head>
<body class="reader">
  <header class="reader-toolbar">
    <a href="/my-library" aria-label="Rudi kwenye maktaba" title="Rudi kwenye maktaba">←</a>
    <h1 id="reader-title">Kitabu</h1>
    <div class="toolbar-group"><button id="prev" title="Ukurasa uliopita" aria-label="Ukurasa uliopita" disabled>‹</button>
      <span id="pages">— / —</span><button id="next" title="Ukurasa unaofuata" aria-label="Ukurasa unaofuata" disabled>›</button></div>
    <div class="toolbar-group"><button id="zoom-out" aria-label="Punguza zoom" title="Punguza zoom" disabled>−</button>
      <span id="zoom-label">100%</span><button id="zoom-in" aria-label="Ongeza zoom" title="Ongeza zoom" disabled>+</button>
      <button id="download" aria-label="Pakua PDF" title="Pakua PDF" disabled>
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/></svg>
      </button></div>
  </header>
  <div class="reader-actions"><button id="open-pdf" class="secondary-button" type="button" disabled>Fungua PDF</button><span>Unaweza kusoma hapa au kupakua kwa kitufe cha juu.</span></div>
  <div class="pdf-stage" id="pdf-stage"><div><p id="reader-message" class="reader-message" role="status">Inafungua kitabu...</p><button id="retry-reader" class="secondary-button" type="button" hidden>Jaribu kufungua tena</button><a id="reader-login" class="secondary-button" hidden>Ingia kwenye akaunti</a></div><canvas id="page-canvas" hidden></canvas></div>
  <script type="module" src="/reader.js"></script>
</body></html>
