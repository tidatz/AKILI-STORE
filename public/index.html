<!doctype html>
<html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="theme-color" content="#ffffff">
<title>eBook</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/preview.css"></head>
<body>
<header class="topbar shell">
  <a class="brand" href="/" aria-label="Nyumbani"><img id="brand-logo" alt="" hidden><span id="brand-name">eBook</span></a>
  <button id="menu-button" class="icon-button" type="button" aria-label="Fungua menu" aria-expanded="false"><span class="hamburger"><i></i><i></i><i></i></span></button>
</header>
<nav id="menu" class="menu" aria-label="Menu kuu" hidden></nav>
<main class="shell">
  <div id="notice" class="notice" role="status" hidden></div>
  <section id="hero" class="hero" aria-labelledby="book-title" hidden>
    <div class="visual-wrap"><div class="book-object">
      <div class="book-spine"></div><div id="book-cover" class="book-front"><div class="cover-fallback" id="cover-fallback"></div></div>
    </div></div>
    <div class="book-details">
      <p class="eyebrow">EBOOK · PDF</p>
      <h1 id="book-title"></h1>
      <p id="book-subtitle" class="subtitle" hidden></p>
      <p id="price" class="price"></p>
      <button id="buy" class="primary-button" type="button">NUNUA SASA</button>
    </div>
  </section>
  <section id="book-list" class="book-list" hidden><h2>Vitabu</h2><div id="book-links"></div></section>
</main>
<dialog id="info-modal" class="modal"><div class="modal-head"><h2 id="info-title"></h2><button class="icon-button close" data-close="info-modal" aria-label="Funga">×</button></div><div id="info-content" class="modal-copy"></div></dialog>
<dialog id="checkout-modal" class="modal"><div class="modal-head"><h2>Nunua eBook</h2><button class="icon-button close" data-close="checkout-modal" aria-label="Funga">×</button></div>
<div id="checkout-stage">
  <div class="order-summary"><strong id="checkout-title"></strong><strong id="checkout-price"></strong></div>
  <form id="checkout-form" class="form-stack">
    <label>Jina kamili<input name="name" autocomplete="name" maxlength="120" required></label>
    <label>Email<input name="email" type="email" autocomplete="email" maxlength="160" required></label>
    <label>Namba ya simu<input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="07XXXXXXXX" required></label>
    <button id="pay" class="primary-button" type="submit">LIPA KWA SIMU</button>
  </form>
</div>
<div id="payment-stage" hidden><p id="payment-message" role="status">Ombi la malipo limetumwa. Thibitisha kwenye simu yako.</p>
<button id="check-payment" class="secondary-button" type="button">ANGALIA HALI YA MALIPO</button></div>
<p id="checkout-error" class="error" role="alert" hidden></p>
</dialog>
<script type="module" src="/preview.js"></script></body></html>
